name: Security Checks

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: [Release to Docker]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: security-check
  cancel-in-progress: true

jobs:
  security-check:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_REF: ${{ github.event_name == 'workflow_run' && format('nyffels/github-runner:run-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || 'nyffels/github-runner:latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve published digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE_REF" | jq -r '.digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=${IMAGE_REF%:*}@${digest}" >> "$GITHUB_ENV"

      - name: Scan image with Trivy (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.75.0
          scanners: vuln
          image-ref: ${{ env.IMAGE_REF }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-weekly-linux-amd64.json
          exit-code: "0"

      - name: Scan image with Trivy (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.75.0
          scanners: vuln
          image-ref: ${{ env.IMAGE_REF }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-weekly-linux-arm64.json
          exit-code: "0"

      - name: Install Docker Scout
        run: |
          bash scripts/install-scout.sh
          docker scout version

      - name: Scan image with Docker Scout
        shell: bash
        run: |
          set -euo pipefail
          docker scout cves "$IMAGE_REF" --platform linux/amd64 --format sarif > scout-weekly-linux-amd64.sarif
          docker scout cves "$IMAGE_REF" --platform linux/arm64 --format sarif > scout-weekly-linux-arm64.sarif

      - name: Generate security report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          for file in trivy-weekly-linux-*.json; do
            jq -e 'type == "object" and (.SchemaVersion | type == "number")' "$file" >/dev/null
          done
          for file in scout-weekly-linux-*.sarif; do
            jq -e '.version == "2.1.0" and (.runs | type == "array" and length > 0)' "$file" >/dev/null
          done

          trivy_files=(trivy-weekly-linux-amd64.json trivy-weekly-linux-arm64.json)
          scout_files=(scout-weekly-linux-amd64.sarif scout-weekly-linux-arm64.sarif)

          TOTAL_COUNT="$(jq -s '[.[].Results[]?.Vulnerabilities[]?] | length' "${trivy_files[@]}")"
          HIGH_CRIT_COUNT="$(jq -s '[.[].Results[]?.Vulnerabilities[]? | select((.Severity // "") == "HIGH" or (.Severity // "") == "CRITICAL")] | length' "${trivy_files[@]}")"
          FIXABLE_COUNT="$(jq -s '[.[].Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "" and ((.FixedVersion // "") | ascii_downcase) != "not fixed")] | length' "${trivy_files[@]}")"
          SCOUT_TOTAL_COUNT="$(jq -s '[.[].runs[]?.results[]?] | length' "${scout_files[@]}")"
          ACTIONABLE_COUNT="$(jq -s '[.[].Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL" or ((.FixedVersion // "") != "" and ((.FixedVersion // "") | ascii_downcase) != "not fixed"))] | length' "${trivy_files[@]}")"
          ACTIONABLE_COUNT="$((ACTIONABLE_COUNT + SCOUT_TOTAL_COUNT))"

          {
            echo "<!-- weekly-security-report -->"
            echo "# Runner Security Report"
            echo ""
            echo "- Generated (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Image: ${IMAGE_REF}"
            echo "- Platforms scanned: linux/amd64, linux/arm64"
            echo ""
            echo "## Trivy overview"
            echo "- Total findings: ${TOTAL_COUNT}"
            echo "- High/Critical findings: ${HIGH_CRIT_COUNT}"
            echo "- Findings with a known fix: ${FIXABLE_COUNT}"
            echo ""
            echo "## Docker Scout overview"
            echo "- Total findings: ${SCOUT_TOTAL_COUNT}"
            echo ""
            echo "## Possible fixes (from Trivy fixed versions)"
            echo ""
            if [[ "$FIXABLE_COUNT" -gt 0 ]]; then
              echo "| CVE | Severity | Package | Installed | Fixed |"
              echo "|---|---|---|---|---|"
              jq -r '
                .Results[]?.Vulnerabilities[]?
                | select((.FixedVersion // "") != "" and ((.FixedVersion // "") | ascii_downcase) != "not fixed")
                | [(.VulnerabilityID // "n/a"), (.Severity // "n/a"), (.PkgName // "n/a"), (.InstalledVersion // "n/a"), (.FixedVersion // "n/a")]
                | @tsv
              ' "${trivy_files[@]}" \
              | sort -u \
              | while IFS=$'\t' read -r cve severity pkg installed fixed; do
                  printf '| %s | %s | %s | %s | %s |\n' "$cve" "$severity" "$pkg" "$installed" "$fixed"
                done
            else
              echo "No fixable vulnerabilities reported by Trivy in this run."
            fi
            echo ""
            echo "## Non-fixable right now"
            echo ""
            echo "Findings without a fixed package version are usually pending upstream distro/vendor patches."
            echo ""
            echo "## Docker Scout findings"
            echo ""
            if [[ "$SCOUT_TOTAL_COUNT" -gt 0 ]]; then
              echo "| CVE | Summary |"
              echo "|---|---|"
              jq -r '
                .runs[].results[]?
                | [(.ruleId // "n/a"), ((.message.text // "n/a") | gsub("[\r\n]+"; " ") | gsub("[|]"; "/"))]
                | @tsv
              ' "${scout_files[@]}" \
              | sort -u \
              | while IFS=$'\t' read -r cve summary; do
                  printf '| %s | %s |\n' "$cve" "$summary"
                done
            else
              echo "No Docker Scout findings in this run."
            fi
          } > weekly-report.md

          {
            echo "total_count=${TOTAL_COUNT}"
            echo "high_crit_count=${HIGH_CRIT_COUNT}"
            echo "fixable_count=${FIXABLE_COUNT}"
            echo "scout_total_count=${SCOUT_TOTAL_COUNT}"
            echo "actionable_count=${ACTIONABLE_COUNT}"
          } >> "$GITHUB_OUTPUT"

          cat weekly-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          retention-days: 30
          name: runner-security-report
          path: |
            trivy-weekly-*.json
            scout-weekly-*.sarif
            weekly-report.md

      - name: Create or update GitHub issue
        if: ${{ steps.report.outputs.actionable_count != '0' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REPORT_PATH: weekly-report.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Runner Security Report (Automated)';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const weeklyIssues = issues.filter(i => !i.pull_request && i.user?.login === 'github-actions[bot]' && /<!-- (weekly|nightly)-security-report -->/.test(i.body ?? '') && /^(Runner|Weekly|Nightly) Security Report/.test(i.title));
            const existing = weeklyIssues.find(i => i.title === title);
            let keptIssueNumber;

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body
              });
              keptIssueNumber = existing.number;
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              keptIssueNumber = created.data.number;
              core.info(`Created issue #${created.data.number}`);
            }

            const staleIssues = weeklyIssues.filter(i => i.number !== keptIssueNumber);
            for (const issue of staleIssues) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Superseded by #${keptIssueNumber}. Closing older security report automatically.`
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });

              core.info(`Closed older weekly issue #${issue.number}`);
            }

      - name: Close security issue when no actionable findings
        if: ${{ steps.report.outputs.actionable_count == '0' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const weeklyIssues = issues.filter(i => !i.pull_request && i.user?.login === 'github-actions[bot]' && /<!-- (weekly|nightly)-security-report -->/.test(i.body ?? '') && /^(Runner|Weekly|Nightly) Security Report/.test(i.title));
            if (weeklyIssues.length === 0) {
              core.info('No open security issues to close.');
              return;
            }

            for (const issue of weeklyIssues) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: 'Security scan found no actionable items across linux/amd64 and linux/arm64. Closing this issue automatically.'
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });

              core.info(`Closed issue #${issue.number}`);
            }
