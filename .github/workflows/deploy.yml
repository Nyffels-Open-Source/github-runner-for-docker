name: Release to Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 2'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: nyffels/github-runner

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  runner_version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.runner.outputs.version }}
    steps:
      - name: Resolve latest runner release
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name | ltrimstr("v")')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    if: github.ref == 'refs/heads/main'
    needs: [validate, runner_version]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            arch: amd64
          - host: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          pull: true
          no-cache: true
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RUNNER_VERSION=${{ needs.runner_version.outputs.version }}
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      - name: Test candidate lifecycle
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          docker run --rm --network none --entrypoint bash "$IMAGE_REF" -ec 'test "$(bin/Runner.Listener --version)" = "$RUNNER_VERSION"; node --version; npm --version; docker --version'
          docker run --rm --network none -v "$PWD/tests:/tests:ro" --entrypoint bash "$IMAGE_REF" /tests/npm.sh
          docker run --rm --network none -v "$PWD/tests:/tests:ro" --entrypoint bash "$IMAGE_REF" /tests/entrypoint.sh
      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  promote:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Promote tested digests
        run: |
          set -euo pipefail
          version="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          sources=()
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            digest="${digest_file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          [[ "${#sources[@]}" == 2 ]]
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${version}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${sources[@]}"
